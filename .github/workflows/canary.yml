name: Engine pin canary

# T56 (R7 mitigation: "Google Maven artifact availability/layout changes... CI canary that fetches
# the pin"). Runs fetchEngine against a COLD cache on a schedule so a broken/moved/re-checksummed
# pinned artifact on Google Maven is caught proactively, rather than only being discovered the next
# time someone happens to touch host/build.gradle.kts — that failure would otherwise hit a brand-new
# user's first-run download first.
# Cadence: weekly (user decision 2026-07-26, superseding the original daily cadence — detection
# window becomes ≤7 days, acceptable for a manual-release project). Friday ~17:17 America/Sao_Paulo
# (UTC-3 year-round, Brazil has no DST) = 20:17 UTC; the :17 offset is deliberate — GitHub delays or
# drops schedules pinned to the top of the hour under load.
on:
  schedule:
    - cron: '17 20 * * 5' # weekly: Friday 20:17 UTC ≈ 17:17 America/Sao_Paulo
  workflow_dispatch:

jobs:
  fetch-pinned-engine:
    # macos-26 (arm64) since the release-automation amendment (REL-02, AD-019) — same runner
    # generation as ci.yml. The daily schedule is deliberate and stays (R7 tripwire), unlike the
    # manual-only main CI.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Deliberately NO cache restore here — the canary's job is to prove the pin is fetchable and
      # checksum-verified from a cold state, exactly what a brand-new user's first run does (P1-H AC1).
      - name: Fetch pinned engine artifacts (cold)
        working-directory: host
        run: ./gradlew fetchEngine --console=plain

      - name: Regenerate + diff engine-manifest.json (pin drift check)
        working-directory: host
        run: |
          ./gradlew generateEngineManifest --console=plain
          git diff --exit-code -- ../extension/engine-manifest.json || \
            (echo "::warning::engine-manifest.json changed from a cold Gradle-resolution run — the pinned artifact closure or its checksums may have drifted upstream" && exit 0)

      - name: Notify on failure
        if: failure()
        run: echo "::error::Pinned engine artifact fetch failed — Google Maven availability or layout may have changed (R7). See job log for the failing artifact."
