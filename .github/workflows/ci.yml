name: CI

# T56 (NFR-07 CI gate), reworked by the release-automation amendment (REL-02, AD-019, 2026-07-26):
# - Triggers are on-demand ONLY: workflow_dispatch (Actions tab / gh CLI), or workflow_call from
#   release.yml and run-ci-comment.yml. No push/pull_request triggers — the maintainer runs CI
#   deliberately to keep hosted-runner usage low; releases stay gated because release.yml always
#   calls this workflow before publishing.
# - The optional `ref` input lets callers point the gate at any ref (the /run ci comment command
#   passes refs/pull/<N>/merge). Empty = the ref the run was started from.
# - One job on three pinned runners (AD-028): macos-26 (arm64), windows-2025 and ubuntu-26.04 (x64;
#   Google publishes no Arm natives for Windows or Linux). Every step is written once and runs on
#   all three; OS differences live inside the step's script. A release needs all three green.
# - Intel Macs stay best-effort (AD-004 amendment): no Intel runner, documented in
#   docs/limitations.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test (empty = the branch you dispatch from)'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (empty = the caller's ref)"
        type: string
        required: false
        default: ''

# Keyed on the tested ref so concurrent /run ci checks of different PRs never cancel each other.
# (When this workflow runs via workflow_call, this workflow-level group is ignored — callers set
# their own concurrency groups.)
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Full pipeline (build, unit, integration, host unit + engineTest, golden corpus, packaged VSIX and
  # the clean-profile smoke) on each pinned runner.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, windows-2025, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # Checked-in scripts (gradlew) and fixtures must keep LF endings on Windows.
      - name: Keep LF line endings on checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The package.json scripts are POSIX shell (./gradlew, cp, rm -rf); npm runs them in cmd.exe on
      # Windows unless told otherwise.
      - name: Run npm scripts in bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm config set script-shell 'C:\Program Files\Git\bin\bash.exe'
          fi

      # Windows: a 177-character engine cache folder puts its longest file at 280 characters, past
      # the classic 260-character MAX_PATH (worst real case: VS Code Insiders and a 20-character
      # username). fetchEngine, engineTest and the corpus read it through INFLATE_ENGINE_CACHE_DIR.
      - name: Put the Windows engine cache under a long path
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            printf 'INFLATE_ENGINE_CACHE_DIR=%s\\long-path-probe-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\\engine-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          fi

      # AD-011: engine cache keyed by the generated manifest hash — a pin bump (T38-style) changes
      # extension/engine-manifest.json's contents and therefore this key, so a version bump always
      # re-downloads while an unchanged pin restores the ~170 MB download-free (R8, NFR-01 cold start).
      # Keyed per OS too: the cache holds that OS's unzipped natives.
      # Restore/save are split (Verifier hardening, 2026-07-26): /run ci gates execute untrusted
      # PR code on the default-branch ref, so they must never WRITE the branch-shared cache that
      # release.yml's gate later restores (cache-poisoning chain). PR-merge refs restore only.
      - name: Restore engine artifact cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.INFLATE_ENGINE_CACHE_DIR || 'host/.engine-cache' }}
          key: engine-cache-${{ runner.os }}-${{ hashFiles('extension/engine-manifest.json') }}

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Extension unit tests
        working-directory: extension
        run: npm test

      # Must run BEFORE the extension integration tests: the chaos suite (T58) drives the REAL JVM
      # host, whose initialize needs the populated engine cache — running it against an empty cache
      # fails with "build.prop (No such file or directory)" (first live CI run, 2026-07-27).
      - name: Fetch engine artifacts (skipped if cache restored)
        working-directory: host
        run: ./gradlew fetchEngine --console=plain

      - name: Save engine artifact cache (trusted refs only — never from a PR-merge gate)
        if: ${{ !startsWith(inputs.ref, 'refs/pull/') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.INFLATE_ENGINE_CACHE_DIR || 'host/.engine-cache' }}
          key: engine-cache-${{ runner.os }}-${{ hashFiles('extension/engine-manifest.json') }}

      - name: Extension integration tests
        working-directory: extension
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "Running the integration tests under xvfb-run"
            command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
            xvfb-run -a npm run test:integration
          else
            npm run test:integration
          fi

      - name: Host build + unit tests
        working-directory: host
        run: ./gradlew build test --console=plain

      - name: Host engine integration tests
        working-directory: host
        run: ./gradlew engineTest --console=plain

      - name: Install corpus dependencies
        working-directory: corpus
        run: npm ci

      - name: Golden-image corpus
        run: npm run corpus

      - name: Measure the engine cache paths
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dir="$INFLATE_ENGINE_CACHE_DIR"
            relative=$(cd "$dir" && find . -type f | awk '{ print length($0) - 1 }' | sort -n | tail -1)
            longest=$(( ${#dir} + relative ))
            default=absent
            [ -e host/.engine-cache ] && default=present
            echo "INFLATE_ENGINE_CACHE_DIR is ${#dir} characters; longest engine cache file path is ${longest} characters; host/.engine-cache ${default}"
            [ "${#dir}" -eq 177 ] && [ "$longest" -gt 260 ] && [ "$default" = absent ]
          else
            echo "engine cache: host/.engine-cache"
          fi

      - name: Package host.jar and the VSIX
        run: npm run package

      - name: Check the packaged host.jar and VSIX
        run: |
          win32=$(jar tf extension/host.jar | grep -c '^com/sun/jna/platform/win32/' || true)
          vsix=$(ls extension/*.vsix)
          size=$(wc -c < "$vsix" | tr -d ' ')
          echo "host.jar holds com/sun/jna/platform/win32/ classes: ${win32}"
          echo "VSIX size at most 50000000 bytes: ${size} bytes (${vsix})"
          [ "$win32" -gt 0 ] && [ "$size" -le 50000000 ]

      # The packaged host.jar, the real manifest and a real download into an empty profile, then a
      # second setup that must not touch the network. On Windows the profile folder is 100
      # characters, as for VS Code Insiders and a 20-character username, which puts the longest
      # engine file past 260 characters.
      - name: Clean-profile smoke
        working-directory: extension
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export INFLATE_SMOKE_PROFILE_PARENT="$RUNNER_TEMP\\globalStorage-long-path-probe-xxxxxxxxxxxxxxxxxxxxxxxx"
            export INFLATE_SMOKE_LONGEST_PATH_ABOVE=260
          fi
          npm run compile-tests
          node out/test/smoke.js

      - name: Upload corpus report (always, so a pass is inspectable too)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report-${{ runner.os }}
          path: |
            corpus/report.html
          if-no-files-found: warn
