name: CI

# T56 (NFR-07 CI gate), reworked by the release-automation amendment (REL-02, AD-019, 2026-07-26):
# - Triggers are on-demand ONLY: workflow_dispatch (Actions tab / gh CLI), or workflow_call from
#   release.yml and run-ci-comment.yml. No push/pull_request triggers — the maintainer runs CI
#   deliberately to keep hosted-runner usage low; releases stay gated because release.yml always
#   calls this workflow before publishing.
# - The optional `ref` input lets callers point the gate at any ref (the /run ci comment command
#   passes refs/pull/<N>/merge). Empty = the ref the run was started from.
# - Runner: macos-26 (arm64; GA since 2026-02, the macos-latest target since 2026-06). AD-004:
#   macOS only, Apple Silicon primary.
# - The former smoke-x64 job was dropped (REL-02): it only re-ran architecture-independent unit
#   tests (the native layoutlib x64 paths live in engineTest/corpus, which it never ran) while
#   Intel hosted runners are being phased out upstream. Intel Macs = best-effort, documented in
#   docs/limitations.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test (empty = the branch you dispatch from)'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (empty = the caller's ref)"
        type: string
        required: false
        default: ''

# Keyed on the tested ref so concurrent /run ci checks of different PRs never cancel each other.
# (When this workflow runs via workflow_call, this workflow-level group is ignored — callers set
# their own concurrency groups.)
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Primary gate: full pipeline (build, unit, integration, host unit + engineTest, golden corpus) on
  # Apple Silicon — the architecture the product is developed and measured against (NFR-01/T57).
  build-and-test-arm64:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # AD-011: engine cache keyed by the generated manifest hash — a pin bump (T38-style) changes
      # extension/engine-manifest.json's contents and therefore this key, so a version bump always
      # re-downloads while an unchanged pin restores the ~170 MB download-free (R8, NFR-01 cold start).
      - name: Cache engine artifacts
        uses: actions/cache@v4
        with:
          path: host/.engine-cache
          key: engine-cache-${{ hashFiles('extension/engine-manifest.json') }}

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Extension unit tests
        working-directory: extension
        run: npm test

      - name: Extension integration tests
        working-directory: extension
        run: npm run test:integration

      - name: Fetch engine artifacts (skipped if cache restored)
        working-directory: host
        run: ./gradlew fetchEngine --console=plain

      - name: Host build + unit tests
        working-directory: host
        run: ./gradlew build test --console=plain

      - name: Host engine integration tests
        working-directory: host
        run: ./gradlew engineTest --console=plain

      - name: Install corpus dependencies
        working-directory: corpus
        run: npm ci

      - name: Golden-image corpus
        run: npm run corpus

      - name: Upload corpus report (always, so a pass is inspectable too)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report-arm64
          path: |
            corpus/report.html
          if-no-files-found: warn
