name: Run CI from a PR comment

# REL-03 (AD-019, 2026-07-26): CI never runs automatically on PRs (REL-02). Instead, a maintainer
# comments `/run ci` on a PR to run the full gate against that PR's merge result.
#
# Security model (the guard below is the point of this file):
# - Only OWNER / MEMBER / COLLABORATOR comment authors trigger anything — i.e. the repo owner and
#   people explicitly invited with repo access. Fork-PR authors are CONTRIBUTOR (after a merged
#   PR) or FIRST_TIME_CONTRIBUTOR/NONE — GitHub's post-merge CONTRIBUTOR label is deliberately NOT
#   trusted, so no outside commenter can start (and pay for) runners.
# - This workflow definition executes from the default branch on issue_comment events — a PR
#   cannot modify this file to bypass the guard.
# - Publish credentials (VSCE_PAT/OVSX_TOKEN) are referenced only by release.yml, which has no
#   comment trigger — PR code built by this gate can never reach them.
# - The gate tests refs/pull/<N>/merge (the would-be merge result). If GitHub has no merge ref
#   (conflict with the base branch), checkout fails visibly — resolve the conflict and re-comment.
on:
  issue_comment:
    types: [created]

# Base token permissions; each job narrows further below (Verifier hardening, 2026-07-26: the
# gate job must NOT inherit issues:write — it builds untrusted PR code).
permissions:
  contents: read

# One gate per PR at a time; a newer /run ci supersedes a still-running older one. The group is a
# ternary on the SAME guard the jobs use: only guard-matching comments join the per-PR group —
# every other comment run gets a unique throwaway group (its own run id), so ordinary PR
# conversation can never cancel an in-progress gate (Verifier finding #1, 2026-07-26; the guards
# below skip jobs but do not stop a run from entering a workflow-level concurrency group).
concurrency:
  group: run-ci-comment-${{ (github.event.issue.pull_request && startsWith(github.event.comment.body, '/run ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) && format('pr-{0}', github.event.issue.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  accept:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/run ci') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest # posting a comment/status does not need a macOS runner
    permissions:
      # The ack comment is posted via the issues REST API, but GitHub permission-checks the
      # TARGET RESOURCE, not the endpoint name — this job posts only to PRs (guard construction),
      # so it needs pull-requests: write, not issues: write (DF-3, 2026-07-27: issues: write 403'd
      # the first live ack).
      pull-requests: write
      statuses: write # the pending full-gate status on the PR head SHA (DF-3, REL-06 AC2)
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      # Resolve the PR head SHA once, here, at accept time — the report job (needs: accept) reuses
      # this output rather than re-resolving, so both statuses land on the exact same commit
      # (REL-06 AC2's single-resolve invariant).
      - name: Resolve the PR head SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .head.sha)
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"

      # issue_comment runs attach to the default branch, so the PR checks area shows nothing
      # unless we post a commit status on the PR head ourselves (DF-3 root cause #2).
      - name: Set full-gate to pending on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.resolve.outputs.head_sha }}" \
            -f state=pending \
            -f context=full-gate \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Posted last: an ack-comment failure must never skip the SHA capture or the pending status
      # above (REL-06 AC3's job-independence extends to steps within this job).
      - name: Acknowledge on the PR with a link to this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body="/run ci accepted from @${{ github.event.comment.user.login }} — running the full gate on this PR's merge result: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  gate:
    # Same guard as accept (duplicated on purpose: the jobs are independent, so an accept-side
    # failure can never block the actual gate).
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/run ci') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    # The called gate builds/tests UNTRUSTED PR code: give it a read-only token and nothing else
    # (Verifier finding #3 — without this it would inherit broader workflow permissions).
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/pull/${{ github.event.issue.number }}/merge

  report:
    needs: [accept, gate]
    # always() so this job still runs when `gate` fails/is skipped; re-checks the guard (accept
    # may have been skipped by the same condition) plus a non-empty head_sha (covers an
    # accept-API failure, which leaves no SHA to report against — REL-06 AC3's edge case).
    if: >-
      always() &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/run ci') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      needs.accept.outputs.head_sha != ''
    runs-on: ubuntu-latest # posting a status does not need a macOS runner
    permissions:
      statuses: write # the final full-gate status on the PR head SHA (REL-06 AC3)
    steps:
      # Explicit mapping, not a passthrough of needs.gate.result: success/failure are written for
      # exactly those two gate outcomes. cancelled/skipped fall through and write NOTHING — a
      # superseding /run ci re-sets pending via its own accept job, a manual cancel with no
      # successor leaves pending until the next comment (REL-06 AC4, deterministic regardless of
      # how GitHub schedules always() jobs on cancellation).
      - name: Report the gate result as the final full-gate status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ needs.gate.result }}" in
            success) state=success ;;
            failure) state=failure ;;
            *)
              echo "gate result '${{ needs.gate.result }}' is neither success nor failure — writing no status (REL-06 AC4)"
              exit 0
              ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ needs.accept.outputs.head_sha }}" \
            -f state="$state" \
            -f context=full-gate \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
